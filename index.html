<!doctype html>
<html lang="zh-CN" data-mode="static">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Steam 卡牌行情</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23f7c66b'/%3E%3Cstop offset='.5' stop-color='%23b59cf0'/%3E%3Cstop offset='1' stop-color='%239be3b1'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3Crect x='10' y='6' width='12' height='20' rx='2' fill='%23fff' opacity='.85'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="app.css">
  <script>
    try {
      var t = JSON.parse(localStorage.getItem("sct-theme") || "null");
      if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      var u = localStorage.getItem("sct-updown");
      if (u === "green") document.documentElement.dataset.updown = "green";
    } catch (e) {}
  </script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/"><span class="brand-mark" aria-hidden="true"></span>Steam 卡牌行情</a>
    <nav class="nav" aria-label="主导航">
      <a href="#/" data-nav="board">价格排行</a>
      <a href="#/foil" data-nav="foil">闪卡专区</a>
      <a href="#/watchlist" data-nav="watch">关注列表<span class="nav-count" id="watch-count"></span></a>
      <a href="#/status" data-nav="status">数据状态</a>
    </nav>
    <div class="search">
      <input type="search" id="global-search" placeholder="搜索卡牌名或游戏名" autocomplete="off" aria-label="搜索卡牌">
      <div class="pop hidden" id="global-pop" role="listbox"></div>
    </div>
    <a class="health" href="#/status" id="health" title="Steam 连接状态"><span class="dot"></span><span>连接中</span></a>
  </header>
  <main id="view"></main>
  <div class="toast hidden" id="toast" role="status"></div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
